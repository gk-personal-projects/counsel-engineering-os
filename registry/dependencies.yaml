# Counsel Engineering OS -- external dependency registry
# Provenance: ORIGINAL (Apache-2.0). Schema: schema/dependency.schema.json.
# Postures ruled at Gate T2-A (D-T2-004/005) and audited 2026-08-12.
# Doctor rule: missing optional/conditional deps NEVER make the system unhealthy.
# Doctor rule 2 (D-T2-030): a present tool with a dead or unproven credential is NOT ready.
#   Credentials live in `credentials:` blocks below. Probes are read-only, non-mutating, and
#   opt-in (-Probe); unprobed liveness reports UNKNOWN and READY is withheld. Never fabricate LIVE.

- id: claude-code
  name: Claude Code
  classification: core-required
  purpose: Runtime substrate for the entire OS.
  required_by: [counsel-core]
  platforms: [windows, macos, linux]
  detect: "claude --version exits 0"
  install_source: "https://claude.com/claude-code"
  verify: "claude --version"
  fallback: none
  remove: n/a
  version_sensitive: true
  consequential_install: true
  last_verified: "2026-08-12"

- id: git
  name: Git
  classification: core-required
  purpose: Repository state, checkpoint machine-state capture, all workflows.
  required_by: [counsel-core, builder]
  platforms: [windows, macos, linux]
  detect: "git --version exits 0"
  install_source: "https://git-scm.com/downloads"
  verify: "git --version"
  fallback: "Session continuity degrades to file-only snapshots (no git drift detection); workflows requiring git are unavailable."
  remove: n/a
  version_sensitive: false
  consequential_install: true
  last_verified: "2026-08-12"

- id: gh
  name: GitHub CLI
  classification: capability-required
  purpose: github-work-sync capability; PR workflows.
  required_by: [github-work-sync]
  platforms: [windows, macos, linux]
  detect: "gh --version exits 0 AND gh auth status exits 0 (functional)"
  install_source: "https://cli.github.com"
  verify: "gh auth status"
  fallback: "Local-first work ledger; manual PR creation."
  remove: "Disable github-work-sync capability; ledger unaffected."
  version_sensitive: false
  consequential_install: true
  last_verified: "2026-08-12"
  credentials:
    - id: gh-token
      env: [GH_TOKEN, GITHUB_TOKEN]
      via: "gh auth login (OS keyring) when no env var is set"
      scope: "repo, read:org -- PR create/read, issue sync"
      probe: gh-auth
      cost: free
      mutating: false
      rotate: "https://github.com/settings/tokens"
      required_by: [github-work-sync]

- id: superpowers
  name: Superpowers (obra/superpowers plugin)
  classification: optional-integration
  purpose: Enhanced process-skill workflows when present and functional.
  required_by: [superpowers-integration]
  platforms: [windows, macos, linux]
  detect: "Plugin present AND its SessionStart bootstrap actually fired this session (functional check -- on Windows without Git Bash it silently no-ops; presence is not enough)."
  install_source: "https://github.com/obra/superpowers (marketplace: superpowers@claude-plugins-official)"
  verify: "New session shows the superpowers bootstrap block; skills invocable."
  fallback: "Counsel-native debugging/review/verification in Core."
  remove: "Uninstall via plugin manager; Counsel behavior unchanged."
  version_sensitive: true
  consequential_install: true
  last_verified: "2026-08-12"

- id: agent-scaffold
  name: Agent Scaffold (jeremyary/agent-scaffold)
  classification: upstream-source-only
  purpose: Upstream architecture source for derived material. NEVER installed or cloned by users; attribution carried in NOTICE/PROVENANCE.
  required_by: []
  platforms: []
  detect: n/a
  install_source: "https://github.com/jeremyary/agent-scaffold (reference only)"
  verify: n/a
  fallback: n/a
  remove: n/a
  version_sensitive: false
  consequential_install: false
  last_verified: "2026-08-12"

