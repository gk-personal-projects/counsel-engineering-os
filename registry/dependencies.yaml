- id: posthog
  name: PostHog (SaaS account + SDK)
  classification: capability-required
  purpose: Ship-loop telemetry - analytics, funnels, feature flags, experiments, surveys. Free tier ~1M events/mo.
  required_by: [ship-loop]
  platforms: [windows, macos, linux]
  detect: "posthog-js (or posthog-node) in project dependencies AND a POSTHOG key env var configured"
  install_source: "https://posthog.com (account) + npm posthog-js"
  verify: "scripts/ship/verify-instrumentation sends a canary event and polls until queryable"
  fallback: "No product telemetry - the feedback skill has nothing to read; ship still works."
  remove: "Uninstall SDK packages; revoke the project key."
  version_sensitive: false
  consequential_install: true   # third-party account + data leaves the machine - explicit consent
  last_verified: "2026-08-17"
  credentials:
    - id: posthog-project-key
      env: [POSTHOG_KEY, NEXT_PUBLIC_POSTHOG_KEY, POSTHOG_PROJECT_KEY]
      scope: "capture-only (write events); public by design -- ships in client bundles"
      probe: none
      probe_note: "The capture endpoint returns 200 for any well-formed key, so a 200 proves nothing about validity. End-to-end liveness comes only from scripts/ship/verify-instrumentation (canary -> queryable), which needs the read-scoped personal API key."
      cost: free
      mutating: false
      rotate: "PostHog > Project settings > Project API key"
      required_by: [ship-loop]
    - id: posthog-personal-api-key
      env: [POSTHOG_PERSONAL_API_KEY]
      scope: "read -- query events; this is the key that lets the feedback skill READ anything"
      probe: posthog-me
      cost: free
      mutating: false
      rotate: "PostHog > Personal settings > Personal API keys"
      required_by: [ship-loop]

- id: sentry
  name: Sentry (SaaS account + SDK)
  classification: capability-required
  purpose: Ship-loop error monitoring at debug depth. Developer free tier has hard-stop limits (no surprise bills).
  required_by: [ship-loop]
  platforms: [windows, macos, linux]
  detect: "@sentry/* in project dependencies AND a DSN configured"
  install_source: "https://sentry.io (account) + npx @sentry/wizard"
  verify: "wizard-generated config present; a test error appears in the Sentry project"
  fallback: "PostHog error tracking (shallower) or none - errors only visible in platform logs."
  remove: "Uninstall SDK packages; revoke the DSN."
  version_sensitive: false
  consequential_install: true   # third-party account + data leaves the machine - explicit consent
  last_verified: "2026-08-17"
  credentials:
    - id: sentry-dsn
      env: [SENTRY_DSN, NEXT_PUBLIC_SENTRY_DSN]
      scope: "ingest-only (write events); public by design"
      probe: none
      probe_note: "Sentry exposes no unauthenticated endpoint that separates a live DSN from a well-formed dead one. Liveness is established only by a test error appearing in the project (see this dependency's verify)."
      cost: free
      mutating: false
      rotate: "Sentry > Project settings > Client Keys (DSN)"
      required_by: [ship-loop]
    - id: sentry-auth-token
      env: [SENTRY_AUTH_TOKEN]
      scope: "org read + release create -- sourcemap upload, release marking"
      probe: sentry-api
      cost: free
      mutating: false
      rotate: "https://sentry.io/settings/account/api/auth-tokens/"
      required_by: [ship-loop]
