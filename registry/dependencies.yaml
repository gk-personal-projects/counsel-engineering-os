  platforms: [windows, macos, linux]
  detect: "supabase --version exits 0; relevance from project stack"
  install_source: "https://supabase.com/docs/guides/cli"
  verify: "supabase --version"
  fallback: "Not needed otherwise."
  remove: n/a
  version_sensitive: true
  consequential_install: true
  last_verified: "2026-08-12"
